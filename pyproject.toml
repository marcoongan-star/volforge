[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "volforge"
version = "0.1.0"
description = "Deterministic options exchange and market-making laboratory"
requires-python = ">=3.12"

[project.optional-dependencies]
test = ["pytest==8.4.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

